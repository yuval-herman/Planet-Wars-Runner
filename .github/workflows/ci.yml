name: Continuous Integration & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Linux Test (GCC) ---
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            libcmocka-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Bootstrap nob & Run Tests (Linux GCC)
        if: runner.os == 'Linux'
        run: |
          gcc -o nob nob.c
          ./nob -test

      # --- Windows Test (Clang) ---
      - name: Set up Clang (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
          platform: x64

      - name: Bootstrap nob & Run Tests (Windows Clang)
        if: runner.os == 'Windows'
        env:
          CC: clang
        run: |
          clang -o nob.exe nob.c
          .\nob.exe -test
